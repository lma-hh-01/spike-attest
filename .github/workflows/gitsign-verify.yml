# Wegwerf-Spike: prueft die gitsign-Signatur des signierten Commits im Runner.
name: gitsign-verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitsign installieren
        run: |
          curl -sSL -o /usr/local/bin/gitsign https://github.com/sigstore/gitsign/releases/download/v0.18.0/gitsign_0.18.0_linux_amd64
          chmod +x /usr/local/bin/gitsign
      - name: Signierten Commit pruefen
        run: |
          git log --format='%H %ce %s' -5
          gitsign verify \
            --certificate-identity lma-hh-01@mailbox.org \
            --certificate-oidc-issuer https://github.com/login/oauth \
            52a9c7b2099aa0a9cd384113d2df821b48ed9603
